[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopsentry"
version = "0.1.0"
description = "Check packages for slopsquatting before they are installed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
slopsentry = "slopsentry.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
