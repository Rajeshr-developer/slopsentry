[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slopsentry"
version = "0.1.0"
description = "Check packages for slopsquatting before they are installed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rajeshr-developer", email = "rajeshr.developer@gmail.com" }]
requires-python = ">=3.10"
keywords = ["security", "supply-chain", "slopsquatting", "typosquatting", "pypi", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/Rajeshr-developer/slopsentry"
Repository = "https://github.com/Rajeshr-developer/slopsentry"
Issues = "https://github.com/Rajeshr-developer/slopsentry/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
slopsentry = "slopsentry.cli:app"

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github", "CLAUDE.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
